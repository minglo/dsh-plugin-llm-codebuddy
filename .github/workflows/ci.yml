# CI：类型、测试、构建与打包产物三道关，任何一道红都不该合入。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = engines 的下界（本地开发用的就是它）；24 = 发布路径用的那条线
        # （OIDC trusted publishing 要求 npm >= 11.5.1，node 22 自带的 npm 10.x
        # 不行）。两条都测，发布用的 node 版本就不会等到发版那天才第一次跑。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # 打包产物冒烟：`files` 漏掉一个运行时相对导入时，构建与单测都还是绿的，
      # 只有装上 tarball 才炸。这里按清单核对，并禁止源码混进产物。
      - name: Pack artifact smoke
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          TARBALL="$(ls "$RUNNER_TEMP/pkg"/*.tgz)"
          echo "artifact: $TARBALL"
          tar -tzf "$TARBALL" | sort > "$RUNNER_TEMP/listing.txt"

          missing=0
          for required in \
            package/package.json \
            package/cordis.patch.yml \
            package/README.md \
            package/LICENSE \
            package/locale/en.json \
            package/locale/zh.json \
            package/dist/index.js \
            package/dist/index.d.ts \
            package/dist/client.js
          do
            if ! grep -qx "$required" "$RUNNER_TEMP/listing.txt"; then
              echo "::error::$required 不在产物里"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          # `.d.ts` 是产物的一部分（类型入口指着它），只有真正的源码是违规项。
          if grep -E '(^|/)src/|\.tsx?$' "$RUNNER_TEMP/listing.txt" | grep -vE '\.d\.ts$' | grep -q .; then
            echo "::error::产物里混进了 TypeScript 源码："
            grep -E '(^|/)src/|\.tsx?$' "$RUNNER_TEMP/listing.txt" | grep -vE '\.d\.ts$'
            exit 1
          fi

          echo "产物核对通过：$(wc -l < "$RUNNER_TEMP/listing.txt") 个条目"

      # 产物可加载性：上面只核对「文件在不在」，这里核对「装得上、import 得动」。
      #
      # 教训来自 tsup → tsdown：`@Remote` 是 TC39 stage-3 装饰器，oxc 只降级老式
      # `experimentalDecorators`，漏配 Babel 时产物里会原样留着 `@Remote`——
      # 690 个测试全绿、构建成功、清单齐全，只有 `import` 那一刻是 SyntaxError，
      # 而测试跑的是 src/，永远踩不到。真实 import 一次是唯一能拦住它的检查。
      - name: Packed artifact loads
        run: |
          mkdir -p "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund "$(ls "$RUNNER_TEMP"/pkg/*.tgz)" >/dev/null
          node --input-type=module -e "
            const mod = await import('dsh-plugin-llm-codebuddy')
            const required = ['Config', 'apply', 'inject', 'name', 'resolveConnectionOptions']
            for (const key of required) {
              if (!(key in mod)) throw new Error('产物缺少导出：' + key)
            }
            if (typeof mod.apply !== 'function') throw new Error('apply 不是函数')
            console.log('产物可加载：' + required.join(', '))
          "

  # 上面那道只在 Linux 上跑：路径分隔符、BOM 容忍与权限语义在 Windows/macOS 上
  # 都没有人看过。这里只跑 typecheck + 测试，不重复构建；node 也只测 22（engines
  # 的下界）——两个平台的差异与 node 版本无关，铺开矩阵只是多烧一遍 runner。
  # pack smoke 用 tar/grep，留在 ubuntu job 里，这里不换 shell。
  #
  # 磁盘语义（原子替换、rename、目录 fsync）自换用 DSH storage 层起不再由本插件
  # 拥有，这道 job 现存的理由是「本插件自己的路径与编码处理在两个平台上跑得通」。
  verify-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
