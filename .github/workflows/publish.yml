# 由版本 tag 触发发布到 npm。
#
# 两个触发口，各自覆盖一种情形：
#   - `push: tags v*`     —— 人手动推 tag
#   - `workflow_dispatch` —— auto-tag.yml 显式呼叫
# auto-tag.yml 用 GITHUB_TOKEN 推 tag，GitHub 会抑制随之而来的 push 事件（防循环），
# 所以自动路径只能靠 dispatch 打通。
#
# 认证走 OIDC（id-token: write），不存 NPM_TOKEN：把本仓库的 workflow 在 npm 上记为
# Trusted Publisher 即可。provenance 也随之免费生成。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC：npm 侧信任本 workflow，无需 token 即可发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 必须 >= node 24：OIDC trusted publishing 要求 npm >= 11.5.1，
          # 而 node 22 自带的 npm 10.x 会在认证阶段静默回退后失败。
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 门禁在这里显式跑，不用 package.json 的 prepublishOnly：那个钩子里写的是
      # `npm run verify`，npm publish 会为它再起一个 npm 进程，绕一圈还叠了一层
      # 包管理器。显式 + --ignore-scripts 更直白，也保证发布前的构建与测试用的
      # 就是 pnpm 装出来的那棵树。
      - run: pnpm run verify

      # 两种情形应该以「提示 + 跳过」而不是红灯收场：
      #   - 该版本已在 npm 上（重跑，或 tag 被推了两次）；
      #   - 这个包在 npm 上**根本不存在**，即首次发布。npm 不接受给尚不存在的包做
      #     OIDC 发布——trusted publisher 只能挂在已存在的包上，`npm publish` 会
      #     直接回一个 404——所以首发必须手工做一次（本地 `npm publish --access public`，
      #     不要加 --provenance：本地没有 OIDC），随后到 npmjs.com 上把本仓库登记成
      #     Trusted Publisher（workflow 文件名填 publish.yml），之后的版本才能走 CI。
      - name: Decide whether to publish
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG"@"$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER 已在 npm 上，无需发布"
          elif ! npm view "$PKG" version >/dev/null 2>&1; then
            echo "::notice title=首次发布::'$PKG' 尚不在 npm 上，OIDC 无法创建它"
            echo "（trusted publisher 只能挂到已存在的包上）。请先手工发布 ${VER} 一次，"
            echo "再在 npm 上为本仓库配置 Trusted Publishing —— 见 README「发布」。"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      # 用 npm（而非 pnpm）发布：pnpm v11+ 的 publish 是自研实现，尚不支持 OIDC
      # trusted publishing（pnpm/pnpm#9812）；npm CLI >= 11.5.1 才会自动检测 OIDC
      # 环境并完成认证与 provenance 生成。
      #
      # --ignore-scripts：构建与测试已在上面显式跑过，不必让 npm 再触发一遍
      # prepublishOnly。
      - run: npm publish --provenance --access public --ignore-scripts
        if: env.skip != 'true'
